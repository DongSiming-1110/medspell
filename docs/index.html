<html lang="zh-CN">
<head>

  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">

  <title>医学拼写</title>
  <link rel="icon" type="image/png" href="doctor_icon.png">
  <link rel="apple-touch-icon" href="icon-192.png">
  <link rel="manifest" href="manifest.webmanifest">
  <script src="install.js" defer></script>
  <style>
    :root {
      color-scheme: light;
      --ink: #163a34;
      --muted: #52695e;
      --leaf: #bded66;
      --forest: #164940;
      --line: #d5e2d5;
      --round: "Nunito", "HarmonyOS Sans", "Microsoft YaHei", sans-serif;
      font: 16px/1.5 var(--round);
      color: var(--ink);
      background-color: #f4f8ef;
    }
    * { box-sizing: border-box; }
    [hidden] { display: none !important; }
    body { margin: 0; }
    .wrap { width: min(100%, 520px); margin: auto; padding: max(14px, env(safe-area-inset-top)) 16px calc(24px + env(safe-area-inset-bottom)); }
    header, .between, .card-actions, summary, .hero-footer { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
    header { padding: 0 2px 14px; }
    .brand { display: inline-flex; gap: 8px; align-items: center; font-weight: 850; font-size: 1.15rem; }
    .brand-mark { width: 31px; height: 31px; display: grid; place-items: center; background: var(--leaf); border-radius: 10px; }
    .brand-mark::after { content: ""; width: 10px; height: 18px; transform: rotate(38deg); border-radius: 16px; border: 2px solid var(--forest); background: linear-gradient(to bottom, white 49%, var(--forest) 50%); }
    #date { color: #4f645a; font-size: .82rem; font-weight: 650; }
    .hero { position: relative; overflow: hidden; isolation: isolate; color: white; background: var(--forest); border-radius: 24px; padding: 17px 21px 16px; }
    .hero::before { content: ""; position: absolute; z-index: -1; width: 200px; height: 200px; border-radius: 50%; border: 1px solid #ffffff1b; box-shadow: 0 0 0 17px #ffffff06, 0 0 0 38px #ffffff06; right: -60px; top: -80px; }
    h1 { margin: 0; color: #e4f6dc; font-size: .93rem; font-weight: 750; }
    .scoreline { display: flex; gap: 5px; align-items: baseline; line-height: 1.13; margin: 4px 0 9px; font-variant-numeric: tabular-nums; }
    #progress { font: 850 2.8rem/1.03 var(--round); letter-spacing: -.065em; }
    #target { color: #d3e9d3; font-size: 1.1rem; font-weight: 720; }
    .hero-footer { font-size: .77rem; color: #e2f1df; gap: 4px 10px; flex-wrap: wrap; }
    #modeLabel { color: #d5e9d7; }
    .hero img { position: absolute; right: 12px; top: 1px; width: 117px; height: 101px; object-fit: contain; pointer-events: none; }
    .track { height: 9px; border-radius: 20px; margin: 8px 0 7px; overflow: hidden; background: #34675b; }
    .bar { height: 100%; background: var(--leaf); box-shadow: inset 0 2px 0 #e1ffab; border-radius: inherit; transition: width .25s ease; }
    .panel { background: #fff; border: 1px solid var(--line); border-radius: 19px; }
    #card, #finish { margin: 12px 0; padding: 17px 18px; box-shadow: 0 3px 0 #e0e8da; }
    .between { align-items: flex-start; }
    #unit { display: inline-block; font: 760 .76rem/1.4 var(--round); color: #285846; background: #eef5dd; border-radius: 8px; padding: 6px 10px; }
    .phrase { margin: 15px 0 0; font: 760 clamp(1.6rem, 7.7vw, 2.23rem)/1.24 var(--round); letter-spacing: -.035em; overflow-wrap: anywhere; }
    .blank { display: inline-block; width: 2.4em; height: .60em; border-radius: 5px 5px 1px 1px; background: #e5f4c7; border-bottom: .10em solid #669237; vertical-align: -.015em; }
    .meaning { font-weight: 690; font-size: 1.07rem; margin: 4px 0 15px; }
    input, select, button { font: inherit; color: inherit; }
    label { display: block; color: var(--muted); font-weight: 680; font-size: .81rem; margin: 11px 0 5px; }
    input, select { width: 100%; max-width: 100%; height: 46px; border: 1.5px solid #bacdbc; border-radius: 11px; background: #fbfdf9; padding: 8px 12px; font-size: 1rem; }
    input::placeholder { color: #69786c; }
    input:focus, select:focus { border-color: #3d8054; }
    :is(input, select, button, summary):focus-visible { outline: 3px solid #398462; outline-offset: 2px; }
    button { min-height: 44px; padding: 9px 14px; background: var(--leaf); color: #214229; border: 1px solid #a0d451; border-radius: 12px; font-weight: 780; cursor: pointer; }
    button:active { transform: translateY(2px); }
    .full { width: 100%; }
    .primary { box-shadow: 0 3px 0 #7da942; }
    .primary:active { box-shadow: 0 1px 0 #7da942; }
    #form .primary { margin-top: 10px; }
    .answer-label { display: flex; align-items: center; justify-content: space-between; gap: 8px; margin-bottom: 4px; }
    .answer-label label { margin: 0; }
    #listen { display: grid; place-items: center; flex: 0 0 44px; height: 44px; padding: 0; color: #285846; background: #eef5dd; border-color: #dce9c7; }
    #listen[data-playing="true"] { color: white; background: var(--forest); border-color: var(--forest); }
    .speaker { width: 24px; height: 24px; position: relative; }
    .speaker::before { content: ""; position: absolute; top: 4px; left: 1px; width: 11px; height: 16px; background: currentColor; clip-path: polygon(0 32%, 35% 32%, 95% 0, 95% 100%, 35% 68%, 0 68%); }
    .speaker::after, .speaker i { position: absolute; border: 2px solid transparent; border-right-color: currentColor; border-radius: 50%; }
    .speaker::after { content: ""; inset: 2px 1px 2px 1px; }
    .speaker i { inset: 5px 6px 5px 5px; }
    #voiceStatus { margin: 3px 0 6px; font-size: .82rem; color: #823114; }
    #voiceStatus:empty { display: none; }
    .card-actions { gap: 12px; margin-top: 9px; }
    .card-actions button, .subtle { background: transparent; border: 0; padding: 7px 4px; color: #4c675c; font-size: .86rem; }
    .card-actions button::before { margin-right: .35em; font-weight: 900; }
    #hint::before { content: "?"; display: inline-grid; place-items: center; width: 1.2em; height: 1.2em; border: 1.5px solid currentColor; border-radius: 50%; font: 780 .8rem/1 var(--round); }
    #ban { color: #75532c; }
    #ban::before { content: "✓"; }
    #clearRound { font-size: .8rem; min-height: 44px; margin: -6px -3px -6px 0; }
    .notice, #feedback { font-size: .88rem; line-height: 1.45; overflow-wrap: anywhere; }
    .notice:not(:empty), #feedback:not(:empty) { padding: 9px 12px; border-radius: 10px; background: #e2f2d4; color: #275435; margin: 10px 0 0; }
    .notice:empty, #feedback:empty { display: none; }
    #feedback.err:not(:empty) { background: #fff0e4; color: #823114; }
    #word[aria-invalid="true"] { border-color: #bd6039; }
    #finish { padding: 23px 18px 20px; }
    #finish h2 { margin: 0; font-size: 1.45rem; }
    #finish .finish-mark { display: grid; place-items: center; width: 42px; height: 42px; border-radius: 14px; background: var(--leaf); color: var(--forest); font-size: 1.6rem; font-weight: 850; margin-bottom: 10px; }
    #finishText, .meta { color: var(--muted); font-size: .86rem; }
    details { margin-top: 9px; padding: 0 15px; scroll-margin-top: 10px; }
    summary { justify-content: flex-start; font-size: .95rem; font-weight: 750; min-height: 53px; list-style: none; cursor: pointer; }
    summary::-webkit-details-marker { display: none; }
    summary::after { content: ""; width: 7px; height: 7px; margin: 0 3px 3px auto; border: solid #637769; border-width: 0 2px 2px 0; transform: rotate(45deg); }
    details[open] > summary::after { transform: rotate(225deg); margin-bottom: -4px; }
    details[open] { padding-bottom: 16px; }
    details[open] > summary { border-bottom: 1px solid var(--line); }
    .icon { width: 28px; height: 28px; border-radius: 9px; display: inline-grid; place-items: center; background: #e5f3d0; }
    .settings-icon { color: #396846; }
    .settings-icon::before { content: ""; width: 14px; height: 14px; background: radial-gradient(circle at 4px 4px, currentColor 2.5px, transparent 3px), radial-gradient(circle at 10px 10px, currentColor 2.5px, transparent 3px), linear-gradient(currentColor,currentColor) center 3px / 14px 2px no-repeat, linear-gradient(currentColor,currentColor) center 9px / 14px 2px no-repeat; }
    .book-icon { background: #ffecd5; color: #975e2d; }
    .book-icon::before { content: ""; width: 11px; height: 13px; border: 2px solid currentColor; border-left-width: 4px; border-radius: 2px 4px 4px 2px; transform: rotate(-8deg); }
    #libraryCount { font-size: .77rem; color: #715738; background: #f8efdf; border-radius: 7px; padding: 0 7px; }
    .controls { display: grid; grid-template-columns: repeat(2,minmax(0,1fr)); gap: 12px; }
    .btns { display: flex; gap: 8px; flex-wrap: wrap; }
    .quiet { background: #edf3e9; border-color: #d3e1d0; }
    #libraryList { list-style: none; margin: 0; padding: 0; }
    #libraryList li { display: flex; gap: 8px; align-items: center; justify-content: space-between; border-top: 1px solid #e4ece0; padding: 10px 0; overflow-wrap: anywhere; }
    #libraryList li > div { flex: 1; min-width: 0; }
    #libraryList strong, #libraryList small { display: block; }
    #libraryList small { color: var(--muted); }
    #libraryList button { font-size: .78rem; }
    .maker-credit { margin-top: 16px; text-align: center; font-size: .8125rem; color: var(--muted); }
    #transfer { margin-top: 16px; border-top: 1px solid var(--line); padding: 0; }
    #transfer textarea { width: 100%; resize: vertical; margin: 0 0 8px; padding: 9px 11px; border: 1.5px solid #bacdbc; border-radius: 11px; font: 1rem/1.4 monospace; color: var(--ink); background: #fbfdf9; }
    #transfer textarea:focus-visible { outline: 3px solid #398462; outline-offset: 2px; }
    #transfer button:disabled { opacity: .5; cursor: default; }
    #transferStatus:empty { display: none; }
    @media(max-width: 345px) { .wrap { padding-inline: 11px; } #card { padding-inline: 14px; } .hero { padding-inline: 16px; } .hero img { width: 96px; } }
    @media(max-height: 540px) and (max-width: 600px) { header { padding-bottom: 7px; } .hero { padding-block: 10px; } .hero img { height: 72px; } #progress { font-size: 2rem; } }
    @media(prefers-reduced-motion: reduce) { *, *::before, *::after { transition: none !important; animation: none !important; } }
</style>

<body>
  <main class="wrap">
    <header>
      <span class="brand"><i class="brand-mark" aria-hidden="true"></i>医学拼写</span>
      <time id="date"></time>
    </header>
    <section class="hero" aria-labelledby="sessionTitle">
      <h1 id="sessionTitle">今日拼写</h1>
      <div class="scoreline" id="scoreline" role="progressbar" aria-label="本组练习进度" aria-valuemin="0"><strong id="progress">0</strong><span id="target"></span></div>
      <img src="mascot.webp" alt="" width="117" height="101">
      <div class="track" aria-hidden="true"><div id="bar" class="bar"></div></div>
      <div class="hero-footer"><span id="dayCount"></span><span id="modeLabel"></span></div>
    </section>
    <p id="notice" class="notice" role="status"></p>
    <section id="card" class="panel" aria-label="当前题目">
      <div class="between"><small id="unit"></small><button type="button" class="subtle" id="clearRound" aria-controls="settings">清空本轮</button></div>
      <div id="phrase" class="phrase" lang="en"></div>
      <p id="zh" class="meaning"></p>
      <form id="form" autocomplete="off">
        <div class="answer-label">
          <label for="word">填写缺少的单词</label>
          <button id="listen" type="button" aria-label="播放完整英文词组" title="播放完整英文词组"><span class="speaker" aria-hidden="true"><i></i></span></button>
        </div>
        <p id="voiceStatus" role="status"></p>
        <input id="word" placeholder="输入英文" type="text" lang="en" autocorrect="off" autocapitalize="none" spellcheck="false" enterkeyhint="done">
        <p id="feedback" class="msg" aria-live="polite"></p>
        <button class="full primary" type="submit">核对拼写</button>
      </form>
      <div class="card-actions">
        <button id="hint" class="link" type="button">查看提示</button>
        <button id="ban" type="button" aria-label="斩，将这道题移入已斩词库">斩 · 已熟悉</button>
      </div>
    </section>
    <section id="finish" class="panel" hidden>
      <div class="finish-mark" aria-hidden="true">✓</div><h2 id="finishTitle"></h2>
      <p id="finishText"></p>
      <button id="more" class="full primary" type="button">再练一组</button>
      <button id="clearFinished" type="button" class="subtle" aria-controls="settings">换个单元练习</button>
    </section>
    <details class="panel" id="settings">
      <summary><span class="icon settings-icon" aria-hidden="true"></span>练习设置</summary>
      <label for="scope">练习范围</label>
      <select id="scope"><option value="0">全部八个单元</option></select>
      <div class="controls">
        <div>
          <label for="goal">每组目标（题）</label>
          <input type="number" inputmode="numeric" id="goal" min="1" step="1" required>
        </div>
        <div>
          <label for="mode">出题顺序</label>
          <select id="mode">
            <option value="seq">按教材顺序</option>
            <option value="mix">打乱顺序</option>
          </select>
        </div>
      </div>
      <p class="meta settings-note">清空本轮后，会从所选范围重新出题。今日答对数和已斩词库会保留。</p>
      <div class="btns">
        <button id="newRound" type="button">清空本轮，开始练习</button>
        <button id="apply" class="quiet" type="button">保存设置</button>
      </div>
      <details id="transfer">
        <summary>转移进度</summary>
        <p class="meta">在原设备生成并复制进度码，在另一台设备粘贴后恢复。两台设备各自保存，继续练习后可重新生成。</p>
        <label for="transferCode">进度码</label>
        <textarea id="transferCode" rows="2" maxlength="8192" autocapitalize="none" spellcheck="false" placeholder="在此粘贴进度码"></textarea>
        <div class="btns">
          <button id="exportCode" type="button" class="quiet">生成进度码</button>
          <button id="copyCode" type="button" class="quiet" disabled>复制</button>
          <button id="previewCode" type="button">核对进度码</button>
        </div>
        <p id="transferStatus" class="meta" role="status"></p>
        <div class="btns" id="transferConfirm" hidden>
          <button id="importCode" type="button">确认替换本机进度</button>
          <button id="cancelImport" type="button" class="quiet">取消</button>
        </div>
      </details>
    </details>
    <details class="panel" id="library">
      <summary><span class="icon book-icon" aria-hidden="true"></span>已斩词库 <span id="libraryCount">0</span></summary>
      <label for="librarySearch">查找已斩词汇</label>
      <input id="librarySearch" type="search" placeholder="输入英文或中文释义" autocomplete="off" spellcheck="false">
      <p id="libraryEmpty" class="meta">还没有已斩词汇。</p>
      <ul id="libraryList"></ul>
    </details>
        <details class="panel" id="installPanel">
      <summary><span class="icon" aria-hidden="true">↓</span>安装到手机</summary>
      <p id="installInstructions" class="meta">在浏览器菜单中选择「添加到主屏幕」或「安装应用」。</p>
      <button type="button" id="installApp" hidden>安装医学拼写</button>
      <p class="meta" id="cacheStatus" role="status"></p>
    </details>

    <footer class="maker-credit">由DSM制作</footer>
  </main>

<script>'use strict';

const bank = JSON.parse(document.getElementById('bank').textContent);
const pronunciations = JSON.parse(document.getElementById('pronunciations').textContent);
const byId = new Map(bank.map(question => [question.id, question]));
const bookOrder = new Map(bank.map((question, index) => [question.id, index]));
const el = id => document.getElementById(id);
const storageKey = 'medspell.progress.v1';

function today() {
  const date = new Date();
  return [date.getFullYear(), String(date.getMonth() + 1).padStart(2, '0'),
    String(date.getDate()).padStart(2, '0')].join('-');
}

function normalize(text) {
  return text.normalize('NFKC').toLowerCase().replace(/[‐‑–—]/g, '-')
    .replace(/[’‘]/g, "'").trim().replace(/\s+/g, ' ');
}

function phrase(question, answer = question.answers[0]) {
  return question.prompt.replace('_', answer);
}

const phraseKey = new Map(bank.map(question => [question.id, normalize(phrase(question))]));

function candidates(scope, mastered) {
  const excluded = new Set(mastered.map(id => phraseKey.get(id)));
  return bank.filter(q => (!scope || q.unit === scope) && !excluded.has(phraseKey.get(q.id)))
    .map(q => q.id);
}

function shuffle(ids) {
  for (let i = ids.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [ids[i], ids[j]] = [ids[j], ids[i]];
  }
}

function newQueue(mode, scope, mastered) {
  const ids = candidates(scope, mastered);
  if (mode === 'mix') shuffle(ids);
  return ids;
}

function fresh() {
  return { date: today(), mode: 'seq', scope: 0, goal: 20, done: 0, roundStart: 0,
    mastered: [], ids: candidates(0, []), pos: 0 };
}

function validNumber(value, min, max) {
  return Number.isSafeInteger(value) && value >= min && value <= max;
}

// Detect copying errors; imported values are also checked against this question bank.
function checksum(text) {
  let hash = 2166136261;
  for (let i = 0; i < text.length; i++) hash = Math.imul(hash ^ text.charCodeAt(i), 16777619);
  return (hash >>> 0).toString(16).padStart(8, '0');
}

const bankFingerprint = checksum(JSON.stringify(bank.map(q => [q.id, q.prompt, q.zh, q.answers])));

function decodeProgress(code) {
  if (code.length > 8192) throw Error('进度码过长，请重新复制。');
  const match = /^MSP1\.([0-9a-f]{8})\.([A-Za-z0-9+/]+={0,2})$/.exec(code.replace(/\s/g, ''));
  if (!match || checksum(match[2]) !== match[1]) throw Error('进度码不完整或版本不匹配，请重新复制。');
  const {bank: fingerprint, progress} = JSON.parse(atob(match[2]));
  if (fingerprint !== bankFingerprint) throw Error('这个进度码来自其他题库。');
  const {date, mode, scope, goal, done, roundStart, mastered, ids, pos} = progress;
  const calendarDate = typeof date === 'string' && /^\d{4}-\d{2}-\d{2}$/.test(date) && new Date(date + 'T00:00:00Z');
  const uniqueIds = list => Array.isArray(list) && list.length <= bank.length &&
    list.every(id => byId.has(id)) && new Set(list).size === list.length;
  if (!calendarDate || !Number.isFinite(calendarDate.getTime()) || calendarDate.toISOString().slice(0, 10) !== date ||
      !['seq', 'mix'].includes(mode) || !validNumber(scope, 0, 8) || !validNumber(goal, 1, bank.length) ||
      !validNumber(done, 0, Number.MAX_SAFE_INTEGER - 1) || !validNumber(roundStart, 0, done) ||
      !uniqueIds(mastered) || !uniqueIds(ids) || !validNumber(pos, 0, ids.length)) throw Error('进度码中的练习记录无效。');
  const allowed = new Set(candidates(scope, mastered));
  if (allowed.size !== ids.length || !ids.every(id => allowed.has(id))) throw Error('进度码中的题目与练习范围不符。');
  if (mode === 'seq' && ids.some((id, i) => i > pos && bookOrder.get(id) < bookOrder.get(ids[i - 1]))) {
    throw Error('进度码中的剩余题目顺序有误。');
  }
  return {date, mode, scope, goal, done, roundStart, mastered, ids, pos};
}

function loadProgress() {
  const seed = fresh();
  try {
    const old = JSON.parse(localStorage.getItem(storageKey));
    if (!old) return seed;
    const mastered = Array.isArray(old.mastered) ? [...new Set(old.mastered.filter(id => byId.has(id)))] : [];
    const scope = validNumber(old.scope, 0, 8) ? old.scope : seed.scope;
    const mode = old.mode === 'mix' ? 'mix' : 'seq';
    const available = candidates(scope, mastered);
    const allowed = new Set(available);
    const validQueue = Array.isArray(old.ids) && old.ids.length === available.length &&
      new Set(old.ids).size === available.length && old.ids.every(id => allowed.has(id));
    const done = validNumber(old.done, 0, Number.MAX_SAFE_INTEGER) ? old.done : 0;
    // Version 1.0 stored the number of extra questions unlocked after the daily goal.
    const baseline = old.roundStart ?? old.extra ?? 0;
    return { date: old.date, mode, scope, mastered, done,
      goal: validNumber(old.goal, 1, bank.length) ? old.goal : seed.goal,
      roundStart: validNumber(baseline, 0, done) ? baseline : 0,
      ids: validQueue ? old.ids : newQueue(mode, scope, mastered),
      pos: validQueue && validNumber(old.pos, 0, old.ids.length) ? old.pos : 0 };
  } catch { return seed; }
}

const s = loadProgress();
let storageOk = true;
let hints = 0;
let activeClip = null;

function stopPronunciation() {
  if (activeClip) {
    activeClip.onended = null;
    activeClip.onerror = null;
    activeClip.pause();
    activeClip = null;
  }
  el('listen').dataset.playing = 'false';
  el('listen').setAttribute('aria-label', '播放完整英文词组');
  el('voiceStatus').textContent = '';
}

async function playPronunciation() {
  if (el('card').hidden) return;
  stopPronunciation();
  const source = pronunciations[s.ids[s.pos]];
  let clip;
  function failed() {
    if (clip && clip !== activeClip) return;
    stopPronunciation();
    el('voiceStatus').textContent = '发音播放失败，请再点一次喇叭。';
  }
  try {
    if (!source) { failed(); return; }
    clip = new Audio(source);
    activeClip = clip;
    clip.onerror = failed;
    clip.onended = () => { if (clip === activeClip) stopPronunciation(); };
    el('listen').dataset.playing = 'true';
    el('listen').setAttribute('aria-label', '重新播放完整英文词组');
    await clip.play();
  } catch { failed(); }
}

function save() {
  try {
    localStorage.setItem(storageKey, JSON.stringify(s));
    storageOk = true;
  } catch { storageOk = false; }
}

function rollDay() {
  if (s.date === today()) return false;
  s.date = today();
  s.done = 0;
  s.roundStart = 0;
  save();
  return true;
}

function groupDone() { return s.done - s.roundStart; }

function draw(message = '') {
  stopPronunciation();
  rollDay();
  const question = byId.get(s.ids[s.pos]);
  const reachedGoal = groupDone() >= s.goal;
  el('card').hidden = !question || reachedGoal;
  el('finish').hidden = !el('card').hidden;
  const [, month, day] = s.date.split('-');
  el('date').textContent = Number(month) + '月' + Number(day) + '日';
  el('date').setAttribute('datetime', s.date);
  el('progress').textContent = String(groupDone());
  el('target').textContent = '/ ' + s.goal + ' 题';
  el('dayCount').textContent = '今日已答对 ' + s.done + ' 题';
  el('scoreline').setAttribute('aria-valuenow', String(Math.min(groupDone(), s.goal)));
  el('scoreline').setAttribute('aria-valuemax', String(s.goal));
  el('bar').style.width = Math.min(100, groupDone() / s.goal * 100) + '%';
  el('modeLabel').textContent = s.mode === 'seq' ? '顺序练习' : '乱序练习';
  el('notice').textContent = storageOk ? message : '当前环境无法保存进度，请使用已安装的应用。';
  el('feedback').textContent = '';
  el('word').setAttribute('aria-invalid', 'false');
  el('word').value = '';
  hints = 0;
  el('hint').textContent = '查看提示';
  el('goal').value = s.goal;
  el('mode').value = s.mode;
  el('scope').value = s.scope;
  if (question && !reachedGoal) {
    el('unit').textContent = 'UNIT ' + String(question.unit).padStart(2, '0') + ' · 第 ' + question.no + ' 题';
    const [before, after] = question.prompt.split('_');
    const blank = document.createElement('span');
    blank.className = 'blank';
    el('phrase').replaceChildren(document.createTextNode(before), blank, document.createTextNode(after));
    el('zh').textContent = question.zh;
  }
  if (el('card').hidden) {
    const empty = s.ids.length === 0;
    el('finishTitle').textContent = empty ? '这个范围的词都已斩过' : reachedGoal ? '本组目标已完成' : '所选范围已练完';
    el('finishText').textContent = empty ? '可以换个单元，或从已斩词库移回词汇。' :
      '今天共答对 ' + s.done + ' 题。可以继续练一组，也可以切换单元。';
    el('more').hidden = empty;
    el('more').textContent = '再练一组（' + Math.min(s.goal, question ? s.ids.length - s.pos : s.ids.length) + ' 题）';
  }
}

function renderLibrary() {
  const query = normalize(el('librarySearch').value);
  el('libraryCount').textContent = String(s.mastered.length);
  const rows = [];
  for (const id of [...s.mastered].reverse()) {
    const q = byId.get(id);
    const english = q.answers.map(answer => phrase(q, answer)).join(' / ');
    if (query && !normalize(english + ' ' + q.zh + ' Unit ' + q.unit).includes(query)) continue;
    const row = document.createElement('li');
    const description = document.createElement('div');
    const title = document.createElement('strong');
    const detail = document.createElement('small');
    title.textContent = english;
    detail.textContent = q.zh + ' · Unit ' + q.unit + ' 第 ' + q.no + ' 题';
    description.append(title, detail);
    const restore = document.createElement('button');
    restore.type = 'button';
    restore.className = 'quiet';
    restore.dataset.restore = id;
    restore.textContent = '移回练习';
    restore.onclick = () => restoreWord(id);
    row.append(description, restore);
    rows.push(row);
  }
  el('libraryList').replaceChildren(...rows);
  el('libraryEmpty').hidden = rows.length > 0;
  el('libraryEmpty').textContent = s.mastered.length ? '没有找到匹配的词汇。' : '斩过的词会保存在这里。';
}

function cutWord() {
  if (el('card').hidden) return;
  const id = s.ids[s.pos];
  const key = phraseKey.get(id);
  const keep = item => phraseKey.get(item) !== key;
  s.mastered.push(id);
  const prefix = s.ids.slice(0, s.pos).filter(keep);
  s.ids = prefix.concat(s.ids.slice(s.pos).filter(keep));
  s.pos = prefix.length;
  save();
  renderLibrary();
  draw('已斩：' + phrase(byId.get(id)) + '。可在已斩词库移回。');
}

function restoreWord(id) {
  if (!s.mastered.includes(id)) return;
  s.mastered = s.mastered.filter(item => item !== id);
  const present = new Set(s.ids);
  const added = candidates(s.scope, s.mastered).filter(item => !present.has(item));
  const remaining = s.ids.slice(s.pos);
  if (s.mode === 'seq') {
    remaining.push(...added);
    remaining.sort((a, b) => bookOrder.get(a) - bookOrder.get(b));
  } else {
    for (const item of added) remaining.splice(Math.floor(Math.random() * (remaining.length + 1)), 0, item);
  }
  s.ids = s.ids.slice(0, s.pos).concat(remaining);
  save();
  renderLibrary();
  draw('已移回练习：' + phrase(byId.get(id)));
}

function settings(startOver) {
  const goal = Number(el('goal').value);
  const scope = Number(el('scope').value);
  const mode = el('mode').value;
  if (!validNumber(goal, 1, bank.length)) {
    el('goal').reportValidity();
    el('goal').focus();
    return;
  }
  rollDay();
  if (startOver || scope !== s.scope || mode !== s.mode) {
    s.roundStart = s.done;
    s.ids = newQueue(mode, scope, s.mastered);
    s.pos = 0;
  }
  s.goal = goal;
  s.scope = scope;
  s.mode = mode;
  save();
  el('settings').open = false;
  draw(startOver ? '新一组已开始。' : '已保存练习设置。');
  el('card').scrollIntoView?.({ block: 'nearest' });
}

el('form').onsubmit = event => {
  event.preventDefault();
  rollDay();
  const q = byId.get(s.ids[s.pos]);
  if (!q || groupDone() >= s.goal) { draw(); return; }
  const value = normalize(el('word').value);
  if (!value || !q.answers.some(answer => normalize(answer) === value)) {
    el('word').setAttribute('aria-invalid', 'true');
    el('feedback').className = 'msg err';
    el('feedback').textContent = value ? '再试一次，留意拼写和词形。' : '先写下你的答案。';
    el('word').focus();
    return;
  }
  s.done++;
  s.pos++;
  save();
  draw('✓ 上一题答对了：' + phrase(q));
  if (!el('card').hidden) el('word').focus();
};
el('hint').onclick = () => {
  const answer = byId.get(s.ids[s.pos]).answers[0];
  el('feedback').className = 'msg';
  el('feedback').textContent = ++hints === 1 ? '首字母 ' + answer[0] + '，共 ' +
    answer.replace(/\s/g, '').length + ' 个字符。' : '参考答案：' + answer;
  el('hint').textContent = '查看答案';
};
el('ban').onclick = cutWord;
el('listen').onclick = playPronunciation;
el('word').oninput = () => {
  if (el('feedback').className === 'msg err') {
    el('word').setAttribute('aria-invalid', 'false');
    el('feedback').textContent = '';
    el('feedback').className = 'msg';
  }
};
el('librarySearch').oninput = renderLibrary;
function openSettings() {
  el('settings').open = true;
  el('settings').scrollIntoView?.({ block: 'start' });
}
el('clearRound').onclick = openSettings;
el('clearFinished').onclick = openSettings;
el('apply').onclick = () => settings(false);
el('newRound').onclick = () => settings(true);

let pendingTransfer = null;
function clearTransferPreview() {
  pendingTransfer = null;
  el('transferConfirm').hidden = true;
  el('transferStatus').textContent = '';
}
el('transferCode').oninput = () => {
  clearTransferPreview();
  el('copyCode').disabled = true;
};
el('exportCode').onclick = () => {
  clearTransferPreview();
  if (rollDay()) draw();
  const payload = btoa(JSON.stringify({bank: bankFingerprint, progress: s}));
  el('transferCode').value = 'MSP1.' + checksum(payload) + '.' + payload;
  el('copyCode').disabled = false;
  el('transferStatus').textContent = '已生成当前进度码，可以复制到另一台设备。';
};
el('copyCode').onclick = async () => {
  const field = el('transferCode');
  const code = field.value;
  if (!code) return;
  try {
    await navigator.clipboard.writeText(code);
    if (field.value === code) el('transferStatus').textContent = '进度码已复制。';
  } catch {
    if (field.value !== code) return;
    field.focus(); field.select();
    el('transferStatus').textContent = '已选中进度码，请在文本菜单选择「复制」。';
  }
};
el('previewCode').onclick = () => {
  clearTransferPreview();
  const code = el('transferCode').value;
  let next;
  try { next = decodeProgress(code); }
  catch (error) {
    el('transferStatus').textContent = /^进度码|^这个进度码/.test(error.message) ? error.message : '进度码格式有误，请重新复制。';
    return;
  }
  let saved;
  try { saved = localStorage.getItem(storageKey); }
  catch { el('transferStatus').textContent = '本机无法访问练习存储，请稍后重试。'; return; }
  pendingTransfer = {next, code, saved, previous: JSON.stringify(s)};
  const scopeName = next.scope ? '第 ' + next.scope + ' 单元' : '全部单元';
  const dayCount = next.date === today() ? '今日答对 ' + next.done + ' 题' : '跨日恢复后，今日答对数从 0 开始';
  el('transferStatus').textContent = next.date + ' · ' + scopeName + ' · ' + (next.mode === 'mix' ? '乱序' : '顺序') +
    ' · 每组 ' + next.goal + ' 题 · 已斩 ' + next.mastered.length + ' 题。' + dayCount + '。确认后会替换本机练习进度。';
  el('transferConfirm').hidden = false;
};
el('cancelImport').onclick = clearTransferPreview;
el('importCode').onclick = () => {
  const pending = pendingTransfer;
  if (!pending) return;
  clearTransferPreview();
  try {
    if (el('transferCode').value !== pending.code || JSON.stringify(s) !== pending.previous ||
        localStorage.getItem(storageKey) !== pending.saved) {
      el('transferStatus').textContent = '进度或进度码已变化，请重新核对。'; return;
    }
    localStorage.setItem(storageKey, JSON.stringify(pending.next));
  } catch { el('transferStatus').textContent = '本机保存失败，请稍后重试。'; return; }
  Object.assign(s, pending.next);
  storageOk = true;
  el('librarySearch').value = '';
  renderLibrary();
  draw('已恢复练习进度。');
  el('transferCode').value = '';
  el('copyCode').disabled = true;
  el('transfer').open = false;
  el('settings').open = false;
};

el('more').onclick = () => {
  rollDay();
  s.roundStart = s.done;
  if (s.pos >= s.ids.length) {
    s.ids = newQueue(s.mode, s.scope, s.mastered);
    s.pos = 0;
  }
  save();
  draw();
};
for (let unit = 1; unit <= 8; unit++) {
  el('scope').add(new Option('Unit ' + unit + ' · ' + candidates(unit, []).length + ' 题', unit));
}
el('goal').max = bank.length;
document.addEventListener('visibilitychange', () => {
  if (document.hidden) stopPronunciation();
  else if (rollDay()) draw();
});
setInterval(() => { if (rollDay()) draw(); }, 30000);
rollDay();
save();
renderLibrary();
draw();
</script></body></html>
